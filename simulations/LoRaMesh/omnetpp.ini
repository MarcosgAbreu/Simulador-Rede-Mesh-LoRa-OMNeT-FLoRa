[General]
network = LoRaMesh
sim-time-limit = 14400s
seed-set = 1
cmdenv-express-mode = false

[Config Mesh]
description = "Mesh LoRa AU915 com encaminhamento multi-hop"
*.simulation.numNodes = 10
*.simulation.areaSize = 1000m
*.simulation.activationMin = 0s
*.simulation.activationMax = 3600s
*.simulation.simulationTime = 14400s
*.simulation.seed = 1
*.simulation.initialMessageInterval = 300s
*.simulation.maxHops = 8
*.simulation.maxRetries = 2
*.simulation.payloadBytes = 24
*.simulation.radioRange = 450m
*.simulation.spreadingFactorMin = 7
*.simulation.spreadingFactorMax = 12
*.simulation.bandwidth = 125000
*.simulation.txPower = 14
*.simulation.au915UplinkBase = 915200000
*.simulation.au915UplinkChannels = 64
*.simulation.outputDir = "runs/default"

[Config Minimal]
extends = Mesh
*.simulation.numNodes = 3
*.simulation.activationMin = 0s
*.simulation.activationMax = 2s
*.simulation.simulationTime = 30s
sim-time-limit = 30s
*.simulation.outputDir = "runs/minimal"
